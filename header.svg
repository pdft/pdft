    <path d="M 40 640 L 100 640 L 120 660 L 120 780 L 50 850" />
    <path d="M 870 90 L 790 90 L 770 110 L 770 260 L 830 320 L 830 500 L 870 540" />
    <path d="M 860 640 L 800 640 L 780 660 L 780 780 L 830 830" />
    <circle cx="130" cy="110" r="3" fill="#ff0033" />
    <circle cx="770" cy="110" r="3" fill="#ff0033" />
  </g>

  <text x="25" y="45" class="mono hud-text">SYS_ID: 0x9028_ROOT</text>
  <text x="25" y="58" class="mono hud-text">HOST: blackarch-core</text>
  <text x="25" y="71" class="mono hud-text">LOG: /dev/null</text>
  <text x="765" y="45" class="mono hud-text">MEM: 0xDEADBEEF</text>
  <text x="765" y="58" class="mono hud-text">TRACE: UNTRACEABLE</text>
  <text x="765" y="71" class="mono hud-text">PROXIES: CHAINED</text>

