    .title-infy { font-family: 'Impact', 'Arial Black', sans-serif; font-weight: 900; fill: url(#redGrad); filter: url(#glow); }
    .sec-title { fill: #ffffff; font-size: 13px; font-weight: 800; letter-spacing: 3px; }
    .card-title { fill: #ffffff; font-size: 13.5px; font-weight: 800; }
    .card-sub { fill: #a5abb8; font-size: 10px; font-weight: 500; }
    .hud-text { fill: #2b2f3a; font-size: 8.5px; }
    .tag-text { fill: #ffffff; font-size: 12px; font-weight: 900; }
  </style>

  <rect width="900" height="960" fill="#07080b" rx="8" />

  <g stroke="#1a1d26" stroke-width="1.2" fill="none">
