    </g>

    <g transform="translate(342, 96)">
      <rect width="215" height="60" rx="6" fill="url(#cardGrad)" stroke="#ff0033" stroke-width="1.2" />
      <rect x="0" y="0" width="52" height="60" rx="6" fill="#ff0033" />
      <text x="26" y="36" text-anchor="middle" class="mono tag-text">C++</text>
      <text x="64" y="26" class="mono card-title">C++</text>
